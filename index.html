<script>/* Pure plan builder: no network, storage or browser dependencies. */
(function(root){
'use strict';
const DEFAULTS=Object.freeze({liftSeconds:30,restSeconds:70,liftRounds:10,downSeconds:10,upSeconds:10,elbowRounds:5,elbowRestSeconds:0,circleSeconds:60,circleRounds:1,circleRestSeconds:0,solo:false,lastRest:true,voice:true,music:true,voiceURI:'embedded',rate:1,countdown:true,keepAwake:true});
const LIMITS={liftSeconds:[5,600],restSeconds:[0,600],liftRounds:[1,30],downSeconds:[2,120],upSeconds:[2,120],elbowRounds:[1,30],elbowRestSeconds:[0,600],circleSeconds:[5,600],circleRounds:[1,30],circleRestSeconds:[0,600]};
function sanitize(raw={}){
 const x={...DEFAULTS};
 for(const [key,[min,max]] of Object.entries(LIMITS)){
  const value=Number(raw[key]);
  if(raw[key]!==undefined && raw[key]!=='' && Number.isFinite(value))x[key]=Math.max(min,Math.min(max,Math.round(value)));
 }
 for(const k of ['solo','music','countdown','keepAwake'])if(typeof raw[k]==='boolean')x[k]=raw[k];
 x.voiceURI='embedded';
 if(Number.isFinite(Number(raw.rate)) && raw.rate!=='')x.rate=Math.max(.7,Math.min(1.2,Number(raw.rate)));
 return x;
}
function clock(seconds){const n=Math.max(0,Math.ceil(Number(seconds)||0));return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`;}
function duration(seconds){const n=Math.max(0,Math.round(Number(seconds)||0));return n>=60?`${Math.floor(n/60)} 分${n%60?' '+n%60+' 秒':''}`:`${n} 秒`;}
function spokenDuration(seconds){const n=Math.round(seconds);return n>=60?`${Math.floor(n/60)}分钟${n%60?n%60+'秒':''}`:`${n}秒`;}
const TITLES=['左手辅助抬右手','垂下手 · 抬起小臂','托着右手转圈'];
function buildPlan(raw,scope='all'){
 const s=sanitize(raw), plan=[];
 const included=scope==='all'?[0,1,2]:[Number(scope)].filter(x=>[0,1,2].includes(x));
 for(const e of included){
  if(e===0)for(let r=1;r<=s.liftRounds;r++){
   plan.push({exercise:0,kind:'lift',round:r,rounds:s.liftRounds,seconds:s.liftSeconds,title:TITLES[0],label:'辅助抬手',instruction:'左手托住右手，缓慢抬到额头位置。',cue:`第${r}组。左手慢慢托起右手至额头位置，练习${spokenDuration(s.liftSeconds)}。`});
   if(s.restSeconds>0)plan.push({exercise:0,kind:'rest',round:r,rounds:s.liftRounds,seconds:s.restSeconds,title:TITLES[0],label:'托放下来 · 休息',instruction:'先用左手托着右手，缓慢放下来，再休息。需要更久就点「休息 +20 秒」。',cue:`本次完成。用左手托着右手，慢慢放下来。接下来休息${spokenDuration(s.restSeconds)}。`});
  }
  if(e===1)for(let r=1;r<=s.elbowRounds;r++){
   plan.push({exercise:1,kind:'down',round:r,rounds:s.elbowRounds,seconds:s.downSeconds,title:TITLES[1],label:'手垂直放下',instruction:'手先垂直放下来。肩膀保持不动。',cue:`第${r}组。手垂直放下来，肩膀保持不动。${spokenDuration(s.downSeconds)}。`});
   plan.push({exercise:1,kind:'up',round:r,rounds:s.elbowRounds,seconds:s.upSeconds,title:TITLES[1],label:'小臂抬起',instruction:'小臂再抬起来，肩膀保持不动。',cue:`小臂抬起来，肩膀保持不动，保持${spokenDuration(s.upSeconds)}。`});
  }
  if(e===2)for(let r=1;r<=s.circleRounds;r++){
   plan.push({exercise:2,kind:'circle',round:r,rounds:s.circleRounds,seconds:s.circleSeconds,title:TITLES[2],label:'手托着手转圈',instruction:'趴好，用左手托着右手转圈。',cue:`趴好，用左手托着右手转圈，练习${spokenDuration(s.circleSeconds)}。`});
  }
  if(e>0){
   const rest=e===1?s.elbowRestSeconds:s.circleRestSeconds;
   if(rest>0){
    const phases=plan.filter(p=>p.exercise===e);plan.splice(plan.length-phases.length,phases.length);
    for(const p of phases){plan.push(p);if(p.kind==='up'||p.kind==='circle')plan.push({exercise:e,kind:'rest',round:p.round,rounds:p.rounds,seconds:rest,title:TITLES[e],label:'休息',instruction:'放松休息。',cue:'这一组完成了，休息一下。'});}
   }
  }
 }
 const expanded=[];
 for(const p of plan){
  if(s.solo&&p.kind!=='rest')expanded.push({...p,kind:'prep',targetKind:p.kind,seconds:p.kind==='lift'?15:5});
  expanded.push(p);
  if(s.solo&&p.kind==='lift')expanded.push({...p,kind:'lower',seconds:10});
 }
 return expanded.map((p,i)=>({...p,id:i}));
}
function totals(plan){return plan.reduce((t,p)=>{t[p.kind==='rest'?'rest':'work']+=p.seconds;t.total+=p.seconds;return t;},{work:0,rest:0,total:0});}
const api={DEFAULTS,LIMITS,TITLES,sanitize,clock,duration,spokenDuration,buildPlan,totals};
if(typeof module!=='undefined'&&module.exports)module.exports=api; else root.RecoveryCore=Object.freeze(api);
})(typeof window!=='undefined'?window:globalThis);
</script><script>/* Pure timer state machine. Long suspended intervals never advance a workout. */
(function(root){
'use strict';
const C=typeof module!=='undefined'&&module.exports?require('./core.js'):root.RecoveryCore;
class Session {
 constructor(settings={},scope='all'){
  this.settings=C.sanitize(settings); this.scope=['all',0,1,2].includes(scope)?scope:'all';
  this.plan=C.buildPlan(this.settings,this.scope);this.index=0;this.state='idle';this.resumeState='cue';
  this.extra={};this.remainingMs=this.current.seconds*1000;this.completed=false;this.reason='';
 }
 get current(){return this.plan[this.index];}
 get phaseSeconds(){return this.current.seconds+(this.extra[this.index]||0);}
 get totalSeconds(){return this.plan.reduce((n,p,i)=>n+p.seconds+(this.extra[i]||0),0);}
 get remainingSeconds(){return this.remainingMs/1000+this.plan.slice(this.index+1).reduce((n,p,j)=>n+p.seconds+(this.extra[this.index+1+j]||0),0);}
 get isActive(){return ['cue','ready','running','paused','between'].includes(this.state);}
 start(){if(this.state==='idle'||this.state==='between'){this.state='cue';this.reason='';return true;}return false;}
 cueFinished(){if(this.state!=='cue')return false;this.state='running';return true;}
 pause(reason='manual'){if(!['running','cue','ready'].includes(this.state))return false;this.resumeState=this.state;this.state='paused';this.reason=reason;return true;}
 resume(){if(this.state!=='paused')return false;this.state=['cue','ready'].includes(this.resumeState)?this.resumeState:'running';this.reason='';return true;}
 tick(deltaMs){
  if(this.state!=='running')return null;
  if(!Number.isFinite(deltaMs)||deltaMs<0||deltaMs>2000){this.pause('interrupted');return 'paused';}
  this.remainingMs=Math.max(0,this.remainingMs-deltaMs);
  if(this.remainingMs<=0)return this.advance();
  return null;
 }
 advance(){
  if(this.index+1>=this.plan.length){this.state='done';this.remainingMs=0;this.completed=true;return 'done';}
  const prev=this.current;this.index++;this.remainingMs=this.phaseSeconds*1000;
  this.state=this.settings.solo||prev.exercise===this.current.exercise?'cue':'between';this.resumeState='cue';this.reason='';
  return this.state;
 }
 nextRoundIndex(){return this.plan.findIndex((p,i)=>i>this.index&&p.exercise===this.current.exercise&&p.round>this.current.round);}
 previousRoundIndex(){return this.plan.findIndex(p=>p.exercise===this.current.exercise&&p.round===this.current.round-1);}
 exerciseIndex(exercise){return this.plan.findIndex(p=>p.exercise===exercise);}
 jumpTo(index){
  if(!Number.isInteger(index)||index<0||index>=this.plan.length)return false;
  const previousState=this.state;
  this.index=index;delete this.extra[index];this.remainingMs=this.current.seconds*1000;
  this.state=['running','cue','ready'].includes(previousState)?'cue':previousState==='paused'?'paused':'idle';
  this.resumeState='cue';this.reason='';this.completed=false;return true;
 }
 addRest(seconds=20){
  if(this.current.kind!=='rest'||!['running','cue','paused'].includes(this.state)||!Number.isFinite(seconds)||seconds<=0)return false;
  this.extra[this.index]=(this.extra[this.index]||0)+seconds;this.remainingMs+=seconds*1000;return true;
 }
 stop(){this.state='done';this.completed=false;this.reason='stopped';}
 snapshot(){return {version:5,settings:this.settings,scope:this.scope,index:this.index,state:this.state,resumeState:this.resumeState,remainingMs:this.remainingMs,extra:this.extra,savedAt:Date.now()};}
 static restore(data){
  if(!data||data.version!==5||!['cue','ready','running','paused','between'].includes(data.state))return null;
  const x=new Session(data.settings,data.scope);
  if(!Number.isInteger(data.index)||data.index<0||data.index>=x.plan.length)return null;
  x.index=data.index;
  if(data.extra&&typeof data.extra==='object')for(const [key,value] of Object.entries(data.extra)){
   const n=Number(key);if(Number.isInteger(n)&&n>=0&&n<x.plan.length&&x.plan[n].kind==='rest'&&Number.isFinite(value)&&value>=0&&value<=864000)x.extra[n]=value;
  }
  if(!Number.isFinite(data.remainingMs)||data.remainingMs<0||data.remainingMs>x.phaseSeconds*1000+1)return null;
  x.remainingMs=data.remainingMs;x.state=data.state==='between'?'between':'paused';
  x.resumeState=['cue','ready'].includes(data.state)?data.state:(data.state==='paused'&&['cue','ready'].includes(data.resumeState)?data.resumeState:'running');
  x.reason='restored';return x;
 }
}

  const delta=performance.now()-lastTick;
  if(delta>=0&&delta<=2000)session.remainingMs=Math.max(0,session.remainingMs-delta);
 }
 cancel();session.pause();lastTick=performance.now();render();save();
 if(announce)void say(['paused'],'暂停。');
}
function transition(event){
 if(event==='cue'||event==='between')announced.clear();
 cancel();lastTick=performance.now();render();save();
 if(event==='cue')void runCue();
 else if(event==='between'){
  void acquireWake();const previous=session.plan[session.index-1];
  const ids=previous?.kind==='lift'?['lower']:[];
  ids.push(previous?.kind==='rest'?(session.current.exercise===1?'ready_1':'ready_rest_circle'):(session.current.exercise===1?'ready_lift':'ready_2'));
  void say(ids,session.current.exercise===1?'休息结束，接下来做小臂练习。':'小臂练习完成了，接下来做转圈练习。');
  sound('done');
 }else if(event==='done'){
  releaseWake();const ids=settings.solo?['solo_done']:session.current.kind==='lift'?['lower','done']:['done'];
  void say(ids,session.current.kind==='lift'?'用左手托住右手，慢慢放下来。完成。':'完成。');
  sound('done');
 }else if(event==='paused'){void acquireWake();}
}
function tick(){
 const now=performance.now(),delta=now-lastTick;lastTick=now;
 music.sync(settings.music&&session.state==='running'&&!['rest','prep','lower'].includes(session.current.kind)&&!document.hidden,voice.playing);
 if(needsWake()&&!wake&&!wakePending&&now>=wakeRetryAt)void acquireWake();
 if(session.state!=='running')return;
 if(settings.solo&&voice.ctx&&voice.ctx.state!=='running'){pause(false);session.reason='audio';$('audioError').hidden=false;render();save();return;}
 const before=Math.ceil(session.remainingMs/1000);
 const event=session.tick(delta);if(event){transition(event);return;}
 announceRemaining(before);
 renderTime();if(now-savedAt>1000){savedAt=now;save();}
}
function primary(){
 $('audioError').hidden=true;
 if(settings.solo)settings.voice=true;
 if(!settings.solo&&['cue','ready'].includes(session.state)&&session.current.kind!=='rest'){startExercise();return;}
 if(['cue','running'].includes(session.state)){pause();return;}
 if(session.state==='done'){reset();return;}
 cancel();
 if(session.state==='paused'){
  if(settings.solo){
   session.state='cue';session.reason='resume';
   if(['prep','lower'].includes(session.current.kind))session.remainingMs=session.phaseSeconds*1000;
   // Re-explain the current stage before resuming its remaining time.
   void runCue();return;
  }
  session.resume();
  if(session.state==='running'&&session.remainingMs<=0){transition(session.advance());return;}
  if(session.state==='cue')void runCue();
  else{lastTick=performance.now();render();save();void say(['resume'],'继续。');void acquireWake();}
 }else if(session.start())void runCue();
}
function flushExtra(){
 clearTimeout(extraTimeout);
 if(!extraPending||session.current.kind!=='rest')return;
 if(session.state==='cue')return;
 const n=extraPending;extraPending=0;
 void say([n>1?'added_multi':'added'],n>1?'休息已经延长。':'休息增加二十秒。');
}
function addRest(){
 if(session.current.kind!=='rest')return;
 if(session.state==='running')tick();
 if(!session.addRest(20))return;
 announced.clear();if(session.state!=='cue')voice.cancel();
 extraPending++;render();save();clearTimeout(extraTimeout);extraTimeout=setTimeout(flushExtra,250);
}
function jump(index){
 if(index<0)return;
 cancel();announced.clear();
 if(!session.jumpTo(index))return;
 lastTick=performance.now();render();save();if(session.state==='cue')void runCue();
}
function reset(){
 $('audioError').hidden=true;
 const exercise=session.current.exercise;
 releaseWake();cancel();announced.clear();session=new Session(settings);
 session.jumpTo(session.exerciseIndex(exercise));lastTick=performance.now();render();save();
}
function renderTime(){
 $('time').textContent=session.state==='done'?'✓':session.current.kind==='lift'&&(['idle','cue','ready'].includes(session.state)||(session.state==='paused'&&session.resumeState!=='running'))?'—':C.clock(session.remainingMs/1000);
 $('arc').style.strokeDashoffset=String(873.363*(1-Math.max(0,Math.min(1,session.remainingMs/(session.phaseSeconds*1000)||0))));
 $('total').textContent=C.clock(session.remainingSeconds);
 $('progress').style.width=Math.max(0,Math.min(100,100*(session.totalSeconds-session.remainingSeconds)/session.totalSeconds))+'%';
}
function render(){
 const p=session.current,rest=p.kind==='rest';
 const labels={prep:'动作就位',lower:'托着手 · 慢慢放下',lift:'抬到额头',rest:'慢慢放下 · 休息',down:'手垂下',up:'小臂抬起 · 肩膀不动',circle:'手托手转圈'};
 const states={idle:'准备',cue:'准备动作',ready:'准备好了再开始',running:rest?'休息':p.kind==='prep'?'就位中 · 随后自动开始':p.kind==='lower'?'慢慢放下':'练习',paused:'暂停',between:'准备下一个动作',done:'完成'};
 $('phase').textContent=session.state==='done'?'完成':rest&&p.exercise!==0?'休息':p.kind==='lift'?(session.state==='running'||session.state==='paused'&&session.resumeState==='running'?'保持姿势':'抬手准备'):labels[p.kind];
 $('round').textContent=session.state==='done'?'':p.round+' / '+p.rounds;
 if(p.kind==='prep'&&session.state!=='done')$('phase').textContent=({lift:'准备抬手',down:'准备垂下手',up:'准备抬起小臂',circle:'准备转圈'})[p.targetKind];
 $('status').textContent=session.reason==='audio'?'语音中断 · 已暂停':states[session.state];
 if(['idle','done'].includes(session.state))$('voiceCaption').textContent=session.state==='done'?'本次练习完成。':settings.solo?'点击一次开始，按语音提示完成动作、休息和后续练习。':'就位后手动开始计时。';
 $('modeHint').textContent=settings.solo?'语音自动引导 · 抬手就位 15 秒 · 其他就位 5 秒。放下手臂另留 10 秒；保持网页在前台。':'抬好或就位后，点击开始计时。练习中先暂停，再切换模式。';
 for(const [id,solo] of [['soloMode',true],['assistedMode',false]]){const b=$(id);b.setAttribute('aria-pressed',String(settings.solo===solo));b.disabled=['cue','ready','running'].includes(session.state);}

 const next=session.plan[session.index+1];
 $('next').textContent=next&&session.state!=='done'?(rest?(next.exercise===p.exercise?'休息后 · 第 '+next.round+' 组':'休息后 · '+(['抬手练习','小臂练习','转圈练习'][next.exercise])):next.kind==='rest'?'做完后 · 休息':'接下来 · '+labels[next.kind]):'';
 const button={idle:'开始',cue:p.kind==='rest'?'暂停':'开始计时',ready:'开始计时',running:'暂停',paused:'继续',between:'准备好了',done:'再来一次'};
 $('primary').textContent=settings.solo?(session.state==='idle'?'开始 · 语音自动引导':session.state==='cue'?'暂停':button[session.state]):p.kind==='lift'&&['cue','ready'].includes(session.state)?'已抬好 · 开始 '+C.duration(p.seconds):button[session.state];
 $('add').hidden=!(rest&&session.isActive);
 $('nextRound').hidden=session.state==='done'||p.rounds<=1;
 $('previousRound').hidden=session.state==='done'||p.rounds<=1;
 $('nextRound').disabled=session.nextRoundIndex()<0;
 $('previousRound').disabled=session.previousRoundIndex()<0;
 document.body.classList.toggle('rest',rest&&session.isActive);document.body.classList.toggle('paused',session.state==='paused');
 for(const b of document.querySelectorAll('[data-scope]')){const active=b.dataset.scope===String(p.exercise);b.classList.toggle('selected',active);b.setAttribute('aria-pressed',String(active));}
 $('live').textContent=states[session.state]+'，'+labels[p.kind]+'，'+p.round+'/'+p.rounds;
 renderTime();
}
$('primary').addEventListener('click',primary);
function setMode(solo){
 if(settings.solo===solo||['cue','ready','running'].includes(session.state))return;
 settings={...settings,solo,voice:true};reset();
}
$('soloMode').addEventListener('click',()=>setMode(true));
$('assistedMode').addEventListener('click',()=>setMode(false));
$('add').addEventListener('click',addRest);
$('nextRound').addEventListener('click',()=>jump(session.nextRoundIndex()));
$('previousRound').addEventListener('click',()=>jump(session.previousRoundIndex()));
for(const b of document.querySelectorAll('[data-scope]'))b.addEventListener('click',()=>{
 const exercise=Number(b.dataset.scope);if(exercise!==session.current.exercise)jump(session.exerciseIndex(exercise));
});
$('settingsButton').addEventListener('click',()=>{
 const panel=$('settingsPanel');panel.hidden=!panel.hidden;$('settingsButton').setAttribute('aria-expanded',String(!panel.hidden));
 if(panel.hidden)return;
 pause(false);voice.cancel();for(const key of fields)$(key).value=settings[key];$('musicEnabled').checked=settings.music;
});
$('settingsForm').addEventListener('submit',e=>{
 e.preventDefault();const raw={...settings,lastRest:true,voiceURI:'embedded',music:$('musicEnabled').checked};
 for(const key of fields)raw[key]=$(key).value;
 const fresh=C.sanitize(raw),timingChanged=fields.some(k=>fresh[k]!==settings[k]);
 settings=fresh;session.settings=settings;$('settingsPanel').hidden=true;$('settingsButton').setAttribute('aria-expanded','false');
 if(timingChanged)reset();else{render();save();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause(false);voice.cancel();releaseWake();save();}else{lastTick=performance.now();void acquireWake();}});
window.addEventListener('pagehide',()=>{pause(false);voice.cancel();releaseWake();save();});
window.addEventListener('pageshow',()=>{lastTick=performance.now();void acquireWake();});
document.addEventListener('pointerdown',()=>{if(needsWake())void acquireWake();});
setInterval(tick,100);render();
if(location.hash==='#test')window.__recoveryTest={get:()=>session.snapshot(),session:()=>session,tick,render,voice:()=>voice,music:()=>music};
})();
</script>
</body></html>
