const $=id=>document.getElementById(id);let rec,ctx,timers=[],sources=[],runId=0;
const R=window.SpeechRecognition||window.webkitSpeechRecognition;
$('capabilities').textContent=JSON.stringify({browser:navigator.userAgent,secureContext:isSecureContext,speechRecognition:!!R,audioContext:!!window.AudioContext});
function log(kind,data){$('log').textContent+=new Date().toISOString().slice(11,23)+' '+kind+' '+JSON.stringify(data??'')+'\n';}
function stop(){runId++;timers.forEach(clearTimeout);timers=[];sources.forEach(s=>{try{s.stop()}catch{}});sources=[];if(rec){try{rec.abort()}catch{}}rec=null;if(ctx)ctx.close().catch(()=>{});ctx=null;}
async function buffer(key){const raw=atob(BANK[key]);return ctx.decodeAudioData(Uint8Array.from(raw,c=>c.charCodeAt(0)).buffer);}
async function run(microphone){stop();const id=runId;$('log').textContent='';$('result').textContent='测试中';if(!R){$('result').textContent='未通过：浏览器未提供语音识别接口';return;}

let actual=[],finals=[],last='',lastAt=0,state='ready';const expected=['开始','暂停','继续','开始','暂停','继续'];

rec.onerror=e=>{log('error',{error:e.error,message:e.message});$('result').textContent='未通过：识别服务错误 '+e.error;stop();};

rec.onaudiostart=()=>log('audiostart');rec.onsoundstart=()=>log('soundstart');rec.onspeechstart=()=>log('speechstart');
rec.onstart=()=>{log('start',{mode:microphone?'microphone':'Edge TTS MediaStreamTrack',track:dest.stream.getAudioTracks()[0].readyState});if(!microphone){const sequence=['start','pause','resume','start','pause','resume'];sequence.forEach((key,i)=>{timers.push(setTimeout(()=>{if(id!==runId)return;const src=ctx.createBufferSource();src.buffer=buffers[key];src.connect(dest);sources.push(src);src.start();log('injectedAudio',{key,voice:'zh-CN-XiaoxiaoNeural',duration:src.buffer.duration});if(i===2){const spoken=ctx.createBufferSource();spoken.buffer=buffers.resume;spoken.connect(ctx.destination);sources.push(spoken);spoken.start(ctx.currentTime+2);log('speakerPlaybackScheduled','继续（测试播放后识别恢复）');}},2000+i*6000));});}};

$('run').onclick=()=>run(false);$('mic').onclick=()=>run(true);$('stop').onclick=()=>{stop();$('result').textContent='已停止';};
