  for(let offset=0;offset<mono.length;offset+=1600){await feed(mono.slice(offset,offset+1600));if(offset%16000===0)$('result').textContent='正在识别 '+Math.round(offset/mono.length*100)+'%';}

  const expected=builtin==='negative'?[]:['开始','暂停','继续','开始','暂停','继续','开始','暂停','继续'];const ok=actual.length===expected.length&&actual.every((x,i)=>x.word===expected[i]&&x.accepted);
  $('result').textContent=ok?(builtin==='negative'?'通过：4 段普通说话均未触发口令':'通过：9/9 个口令识别正确，三轮状态切换成功'):'测试完成：'+actual.length+' 个口令；请核对下方原始结果';
  log('总结',{ok,actual,recognized,seconds:(performance.now()-t)/1000,scope:'真实音频文件 → 浏览器内 Vosk → 命令状态；不是麦克风实测'});
 }catch(e){$('result').textContent='未通过：'+e.message;log('错误',{message:e.message});}finally{if(rec)rec.remove();if(ctx)await ctx.close();$('run').disabled=!$('file').files.length;$('builtin').disabled=false;$('negative').disabled=false;}
